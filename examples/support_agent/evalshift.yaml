# EvalShift eval config for the SDK demo. The suite is not hand-authored: it is produced by
# `evalshift capture sync` from the captures agent.py records (source: captured) -- that is the
# piece this demo proves.
version: 1

# Hosted project slug is supplied at push time: `evalshift push <run> --project <org>/sdk-demo`.

prompts:
  - id: support
    detection: python_string
    path: prompts.py
    variable: AGENT_SYSTEM_PROMPT
    variables: [query]   # matches the promoted cases' inputs key

defaults:
  source_model: gemini-2.5-flash
  target_model: gemini-3.1-flash-lite-preview
  concurrency: 2
  cache: false

# No top-level tool evaluators on purpose: `evalshift capture sync` reads what this suite's
# captures actually contain and writes its own tool_selection / tool_arguments block into the
# managed suites: region below. The toolset each model is offered comes from the promoted case's
# toolset_ref (a .evalshift/toolsets/<sha256>.json sidecar the SDK wrote), not from this file.

# >>> evalshift suites (managed by `evalshift capture sync`) >>>
# Regenerated on every sync, evaluators included: each suite is scored with what
# its own captures contain, so a tool-free suite gets no tool evaluators. Hand
# edits inside this region are overwritten -- set `managed: false` on a suite to
# freeze its entry (sync then prints what it would have written instead).
suites: {}
# <<< evalshift suites <<<
